<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WASM Ball Bouncing Physics Engine</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        h1 {
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        
        #canvas-container {
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border-radius: 10px;
            overflow: hidden;
            background: white;
        }
        
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        button {
            background: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        #status {
            color: white;
            margin-top: 15px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        
        .info {
            color: white;
            margin-top: 10px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>🎱 WASM Ball Bouncing Physics</h1>
    
    <div id="canvas-container"></div>
    
    <div class="controls">
        <button onclick="addRandomBall()">공 추가</button>
        <button onclick="addMultipleBalls()">공 5개 추가</button>
        <button onclick="clearAllBalls()">모두 지우기</button>
        <button onclick="toggleGravity()">중력 ON/OFF</button>
    </div>
    
    <div id="status">WASM 모듈 로딩 중...</div>
    <div class="info">💡 캔버스를 클릭해서 공을 추가할 수 있습니다!</div>
    
    <!-- p5.js 라이브러리 -->
    <script src="p5.min.js"></script>
    
    <!-- WASM 모듈 로딩 -->
    <script>
        var Module = {
            onRuntimeInitialized: function() {
                console.log('WASM 모듈이 로드되었습니다!');
                document.getElementById('status').textContent = '✅ WASM 모듈 로드 완료!';
                
                // 캔버스 크기 설정
                Module._setCanvasSize(800, 600);
            }
        };
    </script>
    <script src="physics.js"></script>
    
    <!-- p5.js 스케치 -->
    <script src="sketch.js"></script>
</body>
</html>
